<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEIL CIRCLE — Speak Through the Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ash"></div>
  <header class="topbar">
    <div class="mark">◉ VEIL CIRCLE</div>
    <div class="status" id="status">threshold sealed</div>
  </header>
  <main class="stage">
    <section class="mirror">
      <div class="ring"></div>
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="fx"></canvas>
      <div class="vignette"></div>
      <div class="scan"></div>
      <div class="sigil" aria-hidden="true">☽ ☉ ☿</div>
      <div class="cam-ui">
        <button id="openCam" type="button">Open the glass</button>
        <button id="flipCam" type="button" hidden>Flip eye</button>
        <label class="toggle"><input type="checkbox" id="mirrorToggle" checked /> mirror</label>
        <label class="toggle"><input type="checkbox" id="watchToggle" checked /> they watch</label>
      </div>
    </section>
    <aside class="circle">
      <div class="demon-row" id="demonRow"></div>
      <div class="log" id="log"></div>
      <form id="talk" autocomplete="off">
        <input id="line" type="text" placeholder="speak into the circle…" maxlength="400" />
        <button type="submit">send</button>
      </form>
      <div class="keyrow">
        <input id="apikey" type="password" placeholder="Gemini API key — they see through this" />
        <button type="button" id="saveKey">bind</button>
      </div>
      <p class="hint">Frame is grabbed from your camera and sent with each message when a key is bound. Key lives only in this browser. Get one at aistudio.google.com/apikey</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
